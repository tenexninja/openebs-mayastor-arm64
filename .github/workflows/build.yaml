name: Build Multi-Arch Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        default: "v2.11.1"
        description: The https://github.com/openebs/mayastor-extensions git tag to pull & build

jobs:
  # We need to be able to iterate over the matrix so we set it up on a fake job
  setup:
    runs-on: ubuntu-latest
    outputs:
      # TODO: Also add the `mayastor` repo
      matrix: |
        {
          "runner":[
            "ubuntu-24.04",
            "ubuntu-24.04-arm"
          ],
          "repo":[
            "mayastor",
            "mayastor-extensions",
            "mayastor-control-plane"
          ]
        }
    steps:
      - run: echo "Matrix setup complete"  # This step is required

  build:
    permissions:
      packages: write
    needs: [setup]
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: openebs/${{ matrix.repo }}
          ref: ${{ inputs.tag }}
          submodules: 'recursive'
          fetch-depth: 0
      - name: Verify the checkout matches the requested tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # Fail early on a typo or a branch name: the images are tagged and
          # versioned with $TAG below, so it must name this exact commit.
          tag_commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          [ "$tag_commit" = "$(git rev-parse HEAD)" ]
          echo "$TAG -> $tag_commit ($(git cat-file -t "refs/tags/$TAG") tag)"

      - uses: cachix/install-nix-action@v31.3.0
      - name: Patch mayastor on arm64 (add --with-crypto flag to spdk)
        run: sed -Ei 's/(armv8-a\+crypto")/\1 "--with-crypto"/' spdk-rs/build_scripts/build_spdk.sh
        if: ${{ matrix.runner == 'ubuntu-24.04-arm' && matrix.repo == 'mayastor' }}
      - name: Build the release images
        env:
          TAG: ${{ inputs.tag }}
        # Pass --tag explicitly. Without it, release.sh and nix/lib/version.nix
        # derive the version from `git describe --exact-match`, which ignores
        # LIGHTWEIGHT tags. Some upstream release tags are lightweight (all three
        # repos at v2.11.1), and actions/checkout fetches even annotated tags as
        # lightweight (https://github.com/actions/checkout/issues/290). The build
        # then falls back to the commit hash: images are tagged with the short
        # sha, and binaries report the previous annotated tag (v2.11.0-N-g<sha>).
        # --tag makes release.sh pass `--argstr tag` to nix, which sets both the
        # image tag and the embedded GIT_VERSION to $TAG.
        run: ./scripts/release.sh --skip-publish --skip-bins --tag "$TAG"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push single-arch images
        env:
          TAG: ${{ inputs.tag }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          ARCH: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}
          LIST: artifacts/images-${{ matrix.repo }}-${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}.txt
        run: |
          # Only the images this build produced: release.sh tags all of them $TAG.
          mapfile -t images < <(docker images --format '{{.Repository}}:{{.Tag}}' \
            | awk -F: -v tag="$TAG" '$1 ~ /^openebs\// && $2 == tag' | sort -u)
          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::release.sh produced no openebs/*:$TAG images"
            exit 1
          fi
          mkdir -p artifacts
          for image in "${images[@]}"; do
            new_tag="$REGISTRY/$image-$ARCH"
            echo "Pushing image '$image' to '$new_tag'"
            docker tag "$image" "$new_tag"
            docker push "$new_tag"
            # Store the base image name for later merging
            echo "$image" >> "$LIST"
          done
          cat "$LIST"

      - name: Upload image list artifact
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.repo }}-${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}
          path: artifacts/images-*.txt

  merge:
    permissions:
      packages: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{ fromJson(needs.setup.outputs.matrix).repo }}
    needs:
      - setup
      - build
    steps:
      - name: Download artifacts for this repo
        uses: actions/download-artifact@v4
        with:
          pattern: images-${{ matrix.repo }}-*
          merge-multiple: true
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull, merge & push images
        run: |
          images=$(cat images-${{ matrix.repo }}-*.txt | tr ' ' '\n' | sort -u)
          for image in $images; do
            echo "Merging image '$image'"
            docker pull "ghcr.io/${{ github.repository_owner }}/$image-amd64"
            docker pull "ghcr.io/${{ github.repository_owner }}/$image-arm64"
            docker manifest create "ghcr.io/${{ github.repository_owner }}/$image" \
              --amend "ghcr.io/${{ github.repository_owner }}/$image-amd64" \
              --amend "ghcr.io/${{ github.repository_owner }}/$image-arm64"
            docker manifest push "ghcr.io/${{ github.repository_owner }}/$image"
            echo "✅ Successfully created multi-arch manifest for $image"
          done
